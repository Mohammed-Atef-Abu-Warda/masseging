name: Deploy Laravel to InfinityFree

on:
  push:
    branches: [ main ] # سيتم التشغيل تلقائياً عند عمل push لفرع main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 1. تجهيز بيئة الـ PHP المناسبة لمشروعك
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2' # يمكنك تغييرها حسب نسخة لارافل لديك

    # 2. تجهيز ملف الإعدادات البيئية المؤقت
    - name: Copy .env file
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    # 3. تثبيت حزم المطورين وتجهيز الأكواد برمجياً للبناء
    - name: Install Composer Dependencies
      run: composer install --no-dev --optimize-autoloader --no-ansi --no-interaction --no-progress --no-scripts

    # 4. عملية الرفع التلقائي عبر الـ FTP إلى مجلد الاستضافة الرئيسي htdocs
    - name: FTP Deploy
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./
        server-dir: /htdocs/ # مجلد الموقع الرئيسي في InfinityFree