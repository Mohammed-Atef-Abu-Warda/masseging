name: Deploy Laravel to InfinityFree

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'

    - name: Copy .env file
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: Install Composer Dependencies
      run: composer install --no-dev --optimize-autoloader --no-ansi --no-interaction --no-progress --no-scripts

    - name: FTP Deploy (Optimized)
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./
        server-dir: /htdocs/
        # الإعدادات الإضافية لتسريع الرفع وحل مشكلة التعليق:
        dangerous-clean-html: false
        timeout: 120000 # زيادة مهلة الانتظار منعاً لقطع الاتصال مفاجئاً
